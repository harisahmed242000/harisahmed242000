<svg width="100%" height="350" viewBox="0 0 1600 350" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7e6e6"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d81e2c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d81e2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6162a"/>
      <stop offset="100%" stop-color="#7a0010"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="350" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="1584" height="334" fill="none" stroke="#c81d25" stroke-width="3" opacity="0.55"/>

  <!-- sun glow + disc -->
  <circle cx="800" cy="150" r="175" fill="url(#sunGlow)">
    <animate attributeName="r" values="165;185;165" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="150" r="112" fill="#c81d25"/>

  <!-- distant torii gate -->
  <g fill="#8a0d18" opacity="0.85">
    <rect x="150" y="215" width="14" height="115"/>
    <rect x="270" y="215" width="14" height="115"/>
    <rect x="130" y="200" width="170" height="14" rx="3"/>
    <rect x="145" y="222" width="140" height="10" rx="3"/>
  </g>

  <!-- horizon brush stroke -->
  <path d="M0,330 C200,322 400,336 600,328 C800,320 1000,336 1200,326 C1400,318 1600,330 1600,330" stroke="#111111" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <ellipse cx="800" cy="343" rx="130" ry="9" fill="#000000" opacity="0.25"/>

  <!-- flowing red cape -->
  <g>
    <path d="M782,162 C736,222 694,300 672,345 C716,320 760,268 792,222 C804,200 798,178 782,162 Z" fill="url(#capeGrad)"/>
    <animateTransform attributeName="transform" type="rotate" values="-3 782 170; 3 782 170; -3 782 170" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- samurai silhouette -->
  <g fill="#0a0a0a">
    <path d="M755,225 L700,345 L900,345 L845,225 Z"/>
    <path d="M775,150 L825,150 L840,228 L760,228 Z"/>
    <path d="M762,158 C745,175 740,200 752,226 L772,222 C764,200 768,178 780,162 Z"/>
    <rect x="735" y="158" width="150" height="9" rx="4" transform="rotate(32 735 158)"/>
    <rect x="792" y="138" width="16" height="18"/>
    <circle cx="800" cy="118" r="26"/>
    <g transform-origin="800px 105px">
      <path d="M778,108 L752,28 L772,96 L730,55 L766,100 L708,78 L772,106 L786,52 L792,102 Z"/>
      <animateTransform attributeName="transform" type="rotate" values="-4 800 105; 4 800 105; -4 800 105" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="852" y="150" width="16" height="7" rx="2" fill="#c81d25" transform="rotate(32 852 150)"/>

  <!-- falling petals -->
  <g fill="#d94f5c">
    <ellipse rx="6" ry="4">
      <animateMotion path="M120,-20 C160,80 60,180 140,340" rotate="auto" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="5" ry="3.5">
      <animateMotion path="M380,-30 C420,90 340,190 400,340" rotate="auto" dur="8s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="1.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="5.5" ry="4">
      <animateMotion path="M1020,-20 C1060,90 980,190 1040,340" rotate="auto" dur="7.5s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="7.5s" begin="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="5" ry="3.5">
      <animateMotion path="M1280,-30 C1320,80 1240,180 1300,340" rotate="auto" dur="8.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8.5s" begin="0.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="4.5" ry="3">
      <animateMotion path="M600,-20 C640,90 560,190 620,340" rotate="auto" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="3s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</svg>
